stages:
  - validate
  - security
  - test
  - prepare
  - plan
  - apply
  - verify

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

variables:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_PLUGIN_CACHE_DIR: "$CI_PROJECT_DIR/.terraform.d/plugin-cache"

  # OpenShift provisioning inputs. Override from Run pipeline / trigger.
  TENANT: "example"
  ENVIRONMENT: "dev"

  # GitLab bootstrap is disabled unless explicitly requested.
  RUN_GITLAB_BOOTSTRAP: "false"

cache:
  key: terraform-providers
  paths:
    - .terraform.d/plugin-cache/

# Root pipeline is intentionally only an orchestrator. Workload-specific jobs
# live under ci/pipelines and reusable controls live under ci/templates.
include:
  - local: ci/templates/terraform.yml
  - local: ci/templates/security.yml
  - local: ci/pipelines/openshift.yml
  - local: ci/pipelines/gitlab-bootstrap.yml
