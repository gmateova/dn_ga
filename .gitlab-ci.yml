stages:
  - validate
  - security
  - test
  - prepare
  - plan
  - apply
  - verify

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

variables:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_PLUGIN_CACHE_DIR: "$CI_PROJECT_DIR/.terraform.d/plugin-cache"
  # Explicit pipeline inputs. Replace example/dev from the Run pipeline UI.
  TENANT: "example"
  ENVIRONMENT: "dev"

cache:
  key: terraform-providers
  paths:
    - .terraform.d/plugin-cache/

.terraform:
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  before_script:
    - mkdir -p "$TF_PLUGIN_CACHE_DIR"
    - terraform version

.resolve-target:
  before_script:
    - chmod +x scripts/resolve-target.sh
    - ./scripts/resolve-target.sh
    - source target.env

terraform-fmt:
  extends: .terraform
  stage: validate
  script:
    - terraform fmt -check -recursive

terraform-validate:
  extends: .terraform
  stage: validate
  script:
    - chmod +x scripts/resolve-target.sh
    - ./scripts/resolve-target.sh
    - source target.env
    - terraform -chdir="$TF_ROOT" init -backend=false
    - terraform -chdir="$TF_ROOT" validate

secret-scan:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --no-banner --redact

checkov:
  stage: security
  image:
    name: bridgecrew/checkov:latest
    entrypoint: [""]
  script:
    - checkov -d . --framework terraform --quiet

tflint:
  stage: validate
  image:
    name: ghcr.io/terraform-linters/tflint:latest
    entrypoint: [""]
  script:
    - tflint --init
    - tflint --recursive

target-check:
  stage: prepare
  image: alpine:3.22
  script:
    - chmod +x scripts/resolve-target.sh
    - ./scripts/resolve-target.sh
  artifacts:
    reports:
      dotenv: target.env

terraform-smoke:
  extends: .terraform
  stage: test
  script:
    - chmod +x scripts/resolve-target.sh
    - ./scripts/resolve-target.sh
    - source target.env
    - terraform -chdir="$TF_ROOT" init -backend=false
    - terraform -chdir="$TF_ROOT" validate

terraform-plan:
  extends: .terraform
  stage: plan
  needs:
    - job: target-check
      artifacts: true
    - terraform-fmt
    - terraform-validate
    - tflint
    - secret-scan
    - checkov
    - terraform-smoke
  script:
    - chmod +x scripts/backend.sh
    - ./scripts/backend.sh
    - terraform -chdir="$TF_ROOT" plan -input=false -out="$CI_PROJECT_DIR/$TF_PLAN_NAME"
    - terraform -chdir="$TF_ROOT" show -json "$CI_PROJECT_DIR/$TF_PLAN_NAME" > "$CI_PROJECT_DIR/tfplan.json"
  artifacts:
    paths:
      - "*.tfplan"
      - tfplan.json
    expire_in: 1 day

policy-gate:
  stage: plan
  image:
    name: openpolicyagent/conftest:latest
    entrypoint: [""]
  needs:
    - job: terraform-plan
      artifacts: true
  script:
    - conftest test tfplan.json --policy policy

terraform-apply:
  extends: .terraform
  stage: apply
  needs:
    - job: target-check
      artifacts: true
    - job: terraform-plan
      artifacts: true
    - policy-gate
  script:
    - chmod +x scripts/backend.sh
    - ./scripts/backend.sh
    - terraform -chdir="$TF_ROOT" apply -input=false -auto-approve "$CI_PROJECT_DIR/$TF_PLAN_NAME"
  environment:
    name: "$TENANT/$ENVIRONMENT"
  resource_group: "$TENANT-$ENVIRONMENT"
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $ENVIRONMENT == "dev"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $ENVIRONMENT == "preope"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $ENVIRONMENT == "ope"'

post-apply-smoke:
  stage: verify
  image: registry.redhat.io/openshift4/ose-cli:latest
  needs:
    - terraform-apply
  script:
    - test -n "$OPENSHIFT_API_URL"
    - test -n "$OPENSHIFT_TOKEN"
    - oc login "$OPENSHIFT_API_URL" --token="$OPENSHIFT_TOKEN"
    - oc -n "$OPENSHIFT_NAMESPACE" get pod "$POD_NAME"
    - oc -n "$OPENSHIFT_NAMESPACE" wait --for=condition=Ready "pod/$POD_NAME" --timeout=120s
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
